# =========================================
#  Font — IosevkaTerm Nerd Font Mono
# =========================================
font_family              IosevkaTerm Nerd Font Mono
font_size                11
adjust_line_height       100%
adjust_column_width      100%

# Smooth, crisp rendering
font_features            -liga -calt

# =========================================
#  Window & Padding
# =========================================
window_padding_width     10
confirm_os_window_close  0
hide_window_decorations  yes

# =========================================
#  Background & Transparency
# =========================================
background #1e202b
background_opacity 0.70

# If you want an iTerm-style wallpaper:
# background_image         ~/Pictures/earth.png
# background_image_layout  scaled
# background_tint          0.10

# =========================================
#  Cursor
# =========================================
cursor_shape             beam
cursor_blink_interval    0.5
cursor_stop_blinking_after 0

# =========================================
#  Colors — Catppuccin Mocha (very close to your screenshot)
# =========================================
include ~/.config/kitty/catppuccin-mocha.conf

# =========================================
#  Scrolling
# =========================================
scrollback_lines         10000

# =========================================
#  Keybindings (mac-like)
# =========================================
map ctrl+shift+c         copy_to_clipboard
map ctrl+shift+v         paste_from_clipboard
map ctrl+shift+r         set-config reload

# =========================================
#  Performance tweaks
# =========================================
repaint_delay            7
sync_to_monitor          yes
